[package]
name = "dns"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36.2"
ipnet = "2.12.2"
netwatcher = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_UI_Shell"] }
wmi = "0.18.4"

[build-dependencies]
embed-resource = "3.0"
